{% extends "users/base_users.html" %}

{% load  static %}


{% block title %}
    Login - Wilayapa
{% endblock title %}
    

{% block content %}
<!--start wrapper-->
<div class="wrapper">
        
  
        
    
        
   <!--start content-->
   <main class="authentication-content">
    <div class="container-fluid">
      <div class="authentication-card">
        <div class="card shadow rounded-0 overflow-hidden">
          <div class="row g-0">
            <div class="col-lg-6  d-flex align-items-center justify-content-center">
              <img src="{% static 'assets/images/error/login-img.jpg' %} " class="img-fluid" alt="">
            </div>
            <div class="col-lg-6">
              <div class="card-body p-4 p-sm-5">
                
                <form class="form-body" method="POST"> {% csrf_token %}
                  
                  
                    <div class="row g-3">
                      <div class="col-12">
                        <label  class="form-label">Usuario</label>
                        <div class="ms-auto position-relative">
                          <div class="position-absolute top-50 translate-middle-y search-icon px-3"><i class="bi bi-envelope-fill"></i></div>
                          {{form.username}}
                        </div>
                      </div>
                      <div class="col-12">
                        <label for="inputChoosePassword" class="form-label">Igresa tu contraseña</label>
                        <div class="ms-auto position-relative">
                          <div class="position-absolute top-50 translate-middle-y search-icon px-3"><i class="bi bi-lock-fill"></i></div>
                          {{form.password}}
                        </div>
                      </div>
                      
                      
                      <div class="col-12">
                        <div class="d-grid">
                          <button type="submit" class="btn btn-primary radius-30">Ingresar</button>
                        </div>
                      </div>
                      
                    </div>
                </form>
             </div>
            </div>
          </div>
        </div>
      </div>
    </div>
   </main>
    
   <!--end page main-->

</div>
<!--end wrapper-->
{% endblock content %}
